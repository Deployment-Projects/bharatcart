server {
    listen 80;
    server_name decormoments.shop www.decormoments.shop;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name decormoments.shop www.decormoments.shop;

    ssl_certificate /etc/letsencrypt/live/decormoments.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decormoments.shop/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://bharatcart-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}